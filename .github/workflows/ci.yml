name: CI

# Guardrail de CI bloqueante (ADR-0003, RAZ-16): build/testes E o teste de
# vazamento cross-tenant (VazamentoCrossTenantRlsTest) rodam aqui — falha
# vermelha nesta pipeline é reprovação, não aviso. O frontend (vitest) também
# é gate, não só o backend (RAZ-180). gitleaks bloqueia segredo no repo
# (AGENTS.md §Segurança/LGPD).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + testes (ArchUnit, travas do razão, cross-tenant RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura JDK 21 (ADR-0012)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      # ./gradlew check roda: testes unitários de todos os módulos, os
      # guardrails ArchUnit (GuardrailsArquiteturaTest — inclui a trava do Clock
      # injetado, RAZ-72) e os guardrails de integração com Postgres real via
      # Testcontainers (RazaoContabilTravasTest, RazaoRlsCrossTenantForeignKeyTest,
      # VazamentoCrossTenantRlsTest e a reversibilidade de migração Flyway up→down→up,
      # ReversibilidadeMigracaoFlywayTest — RAZ-72) — o runner do GitHub Actions já
      # vem com Docker disponível.
      - name: ./gradlew check
        run: ./gradlew check --no-daemon

      - name: Publica relatórios de teste em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  frontend-test:
    name: Frontend (build + vitest) — RAZ-180/RAZ-196
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configura Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      # RAZ-196: gate bloqueante de tipo (tsc -b via vite build), mesmo padrão
      # do backend. Sem este step, erro de tipo nunca reprova o CI — só o
      # vitest (que não type-checa) rodava, e "npm run build" ficava vermelho
      # localmente sem ninguém notar (raiz de vários false-done do front).
      - name: npm run build
        run: npm run build

      # npm test roda o pretest (build de tokens do design system + geração do
      # client de API a partir de openapi/contrato-provisorio.yaml, sem rede/backend)
      # e depois vitest run — mesmo padrão bloqueante do job de backend.
      - name: npm test
        run: npm test

  gitleaks:
    name: gitleaks (segredo no repositório)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
