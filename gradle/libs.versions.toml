# Catálogo de versões centralizado — fonte única de verdade das dependências.
# Alterações de versão de framework/persistência devem referenciar uma ADR.

[versions]
springBoot = "3.3.4"
springDependencyManagement = "1.1.6"
flyway = "10.17.3"
postgresql = "42.7.4"
archunit = "1.3.0"
testcontainers = "1.20.1"
pdfbox = "3.0.8"
awsSdk = "2.28.16"
resilience4j = "2.2.0"
logstashLogbackEncoder = "8.1"

[libraries]
# Persistência / migração (Flyway 10 exige módulo específico por banco).
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
# Incorporação PAdES (byte-range + dicionário /Sig, ISO 32000) do PKCS#7 do gov.br — RAZ-34.
# Apache 2.0 (licenciamento adequado a software público); evitar iText (AGPL/comercial).
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
# Guardrails de arquitetura (fitness functions) — RAZ-2, arquitetura-tecnica §8.
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# Guardrail de CI contra bypass de RLS via FK — RAZ-13 (versão gerenciada pelo BOM do Spring Boot).
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
# Object store S3-compatível (ADR-0018): AWS S3 em nuvem ou MinIO on-prem. BOM alinha
# os módulos do SDK; cliente HTTP JDK-based (leve). RAZ-32.
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awsSdk" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }
awssdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client" }
# Resiliência de borda externa: circuit breaker/retry em chamadas gov.br/PNCP/SICONFI.
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }
# Log JSON com MDC para correlação de requisições na borda HTTP (RAZ-212).
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashLogbackEncoder" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
