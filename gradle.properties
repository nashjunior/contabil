# Build de referência do sistema contábil (Razão / SIAFIC).
# ADR-0002 (monólito modular) + ADR-0012 (plataforma JVM/Spring).

org.gradle.parallel=true
org.gradle.caching=true
# configuration-cache mantido desligado até validarmos compatibilidade do
# io.spring.dependency-management; reavaliar em ADR futura.
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Toolchain fixada em Java 21 LTS (ADR-0012).
javaLanguageVersion=21
