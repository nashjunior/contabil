# Contrato derivado do codigo real (RAZ-120) — NAO escrito por suposicao.
#
# CORRECAO IMPORTANTE (ver comentario e README): a primeira versao deste arquivo foi escrita
# contra um `ExecucaoController` consolidado (3 POST, headers X-Govbr-*) encontrado numa copia
# de workspace de agente (Aurelio) DESCONECTADA do repositorio real. Ao localizar o repositorio
# real (bare metal, fora do sandbox do agente) em runtime, ele mostrou um contrato BEM MAIS RICO
# e DIFERENTE: EmpenhoController/LiquidacaoController/PagamentoController separados (RAZ-105) +
# ExecucaoConsultaController (RAZ-101/ADR-0029), enteId NO PATH (nao header), autenticacao via
# UM UNICO header `Authorization: Bearer <assercao gov.br>` (nao 3 headers customizados) validado
# a cada request por ServicoIdentidade (bootstrap/.../consulta/SessaoAutenticadaHttpResolver.java).
# Este arquivo foi reescrito para bater com o codigo REAL (fonte: arquivos citados em `# java:`
# em `/Volumes/Nash HD/projects/Oberware/contabil`, lidos diretamente nesta sessao).
#
# GAP DE ESCOPO (nao de fidelidade): o Empenho real tem campos ricos (dotacaoId, credorId,
# unidadeGestoraId, contratoId, tipo, classificacaoOrcamentaria, fonteRecurso) que dependeriam de
# telas de cadastro/autocomplete (dotacao, credor, unidade gestora) fora do escopo de "1 tela
# minima". Os nomes/tipos de campo abaixo sao os REAIS; a tela minima aceita esses IDs como texto
# livre (UUID colado), nao como picker — ver README "Gaps".
#
# GAP DE COBERTURA (RAZ-188): fila de aprovacao (GET /liquidacoes) e trilha
# (GET /liquidacoes/{id}/trilha) foram adicionadas ao contrato — client.ts (RAZ-14x) ja as
# consumia sem o contrato estar atualizado, quebrando `npm run build` (tipos fantasma).
# GET /execucao/dotacoes foi adicionado (RAZ-199) para o combo de dotacao do EmpenhoForm.
# POST /liquidacoes/{id}/aprovacao foi adicionado (RAZ-221/ADR-0052) — a decisao do gate
# 4-eyes (LiquidacaoController.aprovar) so existia hardcoded no helper e2e, fora deste
# contrato. Ainda EXISTEM no controller real mas NAO estao neste contrato: lote de
# pagamento (POST /pagamentos:lote), consultas de empenhos/liquidacoes/pagamentos
# "registrados" — follow-up.
#
# FLUXO DE ASSINATURA GOVBR (RAZ-141/ADR-0039 decisao 5): os 3 endpoints de
# POST .../assinatura + GET .../oauth/iniciar + GET .../oauth/callback usam
# HttpSession/cookie, NAO Authorization: Bearer (unica excecao ao security scheme
# padrao — ADR-0017). Os controllers reais (AssinaturaEmpenhoController,
# AssinaturaGovBrOAuthController) tambem NAO usam o prefixo /api/v1 dos demais
# controllers de execucao (RAZ-105) nem, os 2 de oauth, o path {enteId} — por isso
# os 3 paths abaixo tem `servers: [{url: /}]` proprio (absoluto), fora do server
# template /api/v1/entes/{enteId} do resto do contrato. Fiel ao codigo real, nao
# uma inconsistencia deste arquivo.
openapi: 3.0.3
info:
  title: SIAFIC — Execução orçamentária/financeira (derivado do código real)
  version: 0.3.0
  description: >
    Empenho/liquidação/pagamento (escrita, RAZ-105) + execução orçamentária agregada
    (consulta, RAZ-101) + assinatura eletrônica gov.br do empenho (RAZ-141/ADR-0039).
    enteId sempre no path (ADR-0015). Autenticação: Authorization: Bearer <asserção gov.br>,
    validada a cada request (stateless) por ServicoIdentidade — exceto os 3 endpoints de
    assinatura, que usam HttpSession/cookie (ADR-0017, única exceção documentada ao §6.1).
servers:
  - url: /api/v1/entes/{enteId}
    variables:
      enteId:
        default: '00000000-0000-0000-0000-000000000000'
security:
  - govbrBearer: []
paths:
  /execucao/empenhos:
    post:
      operationId: registrarEmpenho
      summary: Registra um empenho. # java: escrita.EmpenhoController.registrar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmpenhoRequest' }
      responses:
        '201':
          description: Empenho registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmpenhoResponse' }
        '400': { $ref: '#/components/responses/ErroContrato' }
        '401': { $ref: '#/components/responses/ErroContrato' }
        '403': { $ref: '#/components/responses/ErroContrato' }
    get:
      operationId: consultarEmpenhosRegistrados
      summary: >-
        Empenhos registrados por ente/período, mais recentes primeiro, cursor opaco
        (RAZ-121). # java: consulta.ExecucaoConsultaController.empenhos
      parameters:
        - name: exercicio
          in: query
          required: false
          schema: { type: integer }
        - name: dataInicio
          in: query
          required: false
          schema: { type: string, format: date }
        - name: dataFim
          in: query
          required: false
          schema: { type: string, format: date }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: Página de empenhos registrados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmpenhosRegistradosResponse' }
        '401': { $ref: '#/components/responses/ErroContrato' }
        '403': { $ref: '#/components/responses/ErroContrato' }
  /execucao/empenhos/{id}:
    get:
      operationId: consultarEmpenhoPorId
      summary: >-
        Empenho por id com status e bloco documento (metadados de assinatura,
        sem o binário — ADR-0039 decisão 1). # java: consulta.ExecucaoConsultaController.empenhoPorId
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Empenho com status e bloco documento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmpenhoPorIdResponse' }
        '401': { $ref: '#/components/responses/ErroContrato' }
        '403': { $ref: '#/components/responses/ErroContrato' }
        '404':
          description: >-
            Empenho inexistente para o ente — codigo `empenho_nao_encontrado`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroContratoResponse' }
  /execucao/empenhos/{id}/documento:
    get:
      operationId: consultarDocumentoEmpenho
      summary: Stream do PDF ATUAL do empenho (assinado, senão o pendente). # java: consulta.EmpenhoDocumentoController.documento
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: PDF do empenho (assinado ou pendente de assinatura).
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/ErroContrato' }
        '403': { $ref: '#/components/responses/ErroContrato' }
        '404':
          description: >
            Empenho inexistente ou sem documento (nem pendente nem assinado) —
            codigo `documento_nao_encontrado` (ADR-0009).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroContratoResponse' }
  /execucao/liquidacoes:
    get:
      operationId: consultarFilaAprovacao
      summary: >-
        Fila de aprovação de liquidações por statusAprovacao, cursor opaco, PII do credor
        não exposta (ADR-0029 §1). # java: consulta.ExecucaoConsultaController.fila
      parameters:
        - name: statusAprovacao
          in: query
          required: false
          schema: { type: string, enum: [pendente, aprovada, devolvida], default: pendente }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
        - name: fonte
          in: query
          required: false
          schema: { type: string }
        - name: dataInicio
          in: query
          required: false
          schema: { type: string, format: date }
        - name: dataFim
          in: query
          required: false
          schema: { type: string, format: date }
        - name: valorMin
          in: query
          required: false
          schema: { type: string }
        - name: valorMax
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Página da fila de aprovação.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FilaAprovacaoResponse' }
        '401': { $ref: '#/components/responses/ErroContrato' }
        '403': { $ref: '#/components/responses/ErroContrato' }
    post:
      operationId: registrarLiquidacao
      summary: Registra uma liquidação vinculada a um empenho. # java: escrita.LiquidacaoController.registrar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiquidacaoRequest' }
      responses:
        '201':
          description: Liquidação registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiquidacaoResponse' }
        '400': { $ref: '#/components/responses/ErroContrato' }
        '401': { $ref: '#/components/responses/ErroContrato' }
        '409': { $ref: '#/components/responses/ErroContrato' }
  /execucao/liquidacoes/{id}/trilha:
    get:
      operationId: consultarTrilhaLiquidacao
      summary: >-
        Trilha dedicada da liquidação (empenho → liquidação → decisão), ator mascarado
        (ADR-0029 §3). # java: consulta.ExecucaoConsultaController.trilha
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Trilha de eventos da liquidação.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrilhaResponse' }
        '401': { $ref: '#/components/responses/ErroContrato' }
        '403': { $ref: '#/components/responses/ErroContrato' }
  /execucao/liquidacoes/{id}/aprovacao:
    post:
      operationId: aprovarLiquidacao
      summary: >-
        Decisão do gate de aprovação 4-eyes sobre uma liquidação pendente (ADR-0023,
        RAZ-221/ADR-0052). # java: escrita.LiquidacaoController.aprovar
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AprovacaoRequest' }
      responses:
        '200':
          description: Liquidação decidida (aprovada ou devolvida).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiquidacaoResponse' }
        '400': { $ref: '#/components/responses/ErroContrato' }
        '401': { $ref: '#/components/responses/ErroContrato' }
        '403': { $ref: '#/components/responses/ErroContrato' }
        '409': { $ref: '#/components/responses/ErroContrato' }
  /execucao/pagamentos:
    post:
      operationId: registrarPagamento
      summary: Registra um pagamento vinculado a uma liquidação. # java: escrita.PagamentoController.registrar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PagamentoRequest' }
      responses:
        '201':
          description: Pagamento registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagamentoResponse' }
        '400': { $ref: '#/components/responses/ErroContrato' }
        '401': { $ref: '#/components/responses/ErroContrato' }
        '409': { $ref: '#/components/responses/ErroContrato' }
  /execucao/dotacoes:
    get:
      operationId: consultarDotacoes
      summary: >-
        Dotações do ente/exercício com saldo inline (valorAutorizado -
        valorComprometido), cursor opaco (ADR-0038). Alimenta o combo de dotação
        do EmpenhoForm. # java: consulta.ExecucaoConsultaController.dotacoes
      parameters:
        - name: exercicio
          in: query
          required: true
          schema: { type: integer }
        - name: busca
          in: query
          required: false
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: Página de dotações com saldo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DotacoesResponse' }
        '401': { $ref: '#/components/responses/ErroContrato' }
        '403': { $ref: '#/components/responses/ErroContrato' }
  /execucao/orcamentaria:
    get:
      operationId: consultarExecucaoOrcamentaria
      summary: Execução orçamentária agregada do período. # java: consulta.ExecucaoConsultaController.orcamentaria
      parameters:
        - name: exercicio
          in: query
          required: true
          schema: { type: integer }
        - name: mes
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: Execução orçamentária do período.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecucaoOrcamentariaResponse' }
        '401': { $ref: '#/components/responses/ErroContrato' }
        '403': { $ref: '#/components/responses/ErroContrato' }
  /razao/saldo:
    get:
      operationId: consultarSaldo
      summary: Saldo atual de uma conta contábil do razão. # java: consulta.RazaoConsultaController.saldo
      parameters:
        - name: contaId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Saldo da conta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaldoContaResponse' }
        '401': { $ref: '#/components/responses/ErroContrato' }
        '403': { $ref: '#/components/responses/ErroContrato' }
  /razao/balancete:
    get:
      operationId: consultarBalancete
      summary: >-
        Balancete do período: linhas por conta + totais de movimento (D/C).
        # java: consulta.RazaoConsultaController.balancete
      parameters:
        - name: exercicio
          in: query
          required: true
          schema: { type: integer }
        - name: mes
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: Balancete do período.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceteResponse' }
        '401': { $ref: '#/components/responses/ErroContrato' }
        '403': { $ref: '#/components/responses/ErroContrato' }
  /razao/demonstracoes-dcasp:
    get:
      operationId: consultarDemonstracoesDcasp
      summary: >-
        Demonstrações DCASP do exercício: Balanço Orçamentário, Balanço Financeiro,
        Balanço Patrimonial e DVP. # java: consulta.RazaoConsultaController.demonstracoesDcasp
      parameters:
        - name: exercicio
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Demonstrações DCASP derivadas do razão.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemonstracoesDcaspResponse' }
        '401': { $ref: '#/components/responses/ErroContrato' }
        '403': { $ref: '#/components/responses/ErroContrato' }
  /razao/contas:
    get:
      operationId: consultarContas
      summary: Catálogo/busca de contas do PCASP, cursor opaco. # java: consulta.CatalogoContasController.contas
      parameters:
        - name: busca
          in: query
          required: false
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: Página de contas do catálogo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContasResponse' }
        '401': { $ref: '#/components/responses/ErroContrato' }
        '403': { $ref: '#/components/responses/ErroContrato' }
  /entes/{enteId}/execucao/empenhos/{id}/assinatura:
    servers:
      - url: /
    post:
      operationId: assinarEmpenho
      summary: >-
        Dispara AssinarEmpenho na sessão OAuth2 interativa do ordenador já aberta pelo
        fluxo abaixo (ADR-0027 (c), RAZ-103). # java: assinatura.AssinaturaEmpenhoController.assinar
      security:
        - assinaturaSessao: []
      parameters:
        - name: enteId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Empenho assinado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssinaturaEmpenhoResponse' }
        '403':
          description: >-
            Envelope único de erro com codigo ente_divergente — sessão IAM ou token gov.br
            de outro ente (RAZ-79 §6.1).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroContratoResponse' }
  /assinatura/oauth/iniciar:
    servers:
      - url: /
    get:
      operationId: iniciarOAuthAssinatura
      summary: >-
        302 para o authorization endpoint gov.br (PKCE) — inicia a assinatura eletrônica
        interativa do ordenador; state/codeVerifier ficam na HttpSession (ADR-0017).
        # java: assinatura.AssinaturaGovBrOAuthController.iniciar
      security:
        - assinaturaSessao: []
      responses:
        '302':
          description: Redirect para o authorization endpoint gov.br com state/PKCE.
          headers:
            Location: { schema: { type: string, format: uri } }
  /sessao/atual:
    servers:
      - url: /
    get:
      operationId: sessaoAtual
      summary: >-
        "Quem sou eu" (RAZ-203/ADR-0035) — reflete a Sessao já verificada pelo
        SessaoAutenticadaHttpResolver (cookie do BFF de login OU Authorization: Bearer,
        igual às consultas), sem enteId no path porque é justamente o dado que este
        endpoint descobre. Usado pelo SPA para hidratar AuthContext após o redirect de
        volta do gov.br. # java: sessao.SessaoAtualController.atual
      security:
        - govbrBearer: []
        - sessaoLogin: []
      responses:
        '200':
          description: Sessão autenticada atual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoAtualResponse' }
        '401': { $ref: '#/components/responses/ErroContrato' }
  /sessao/dev-idp/token:
    servers:
      - url: /
    post:
      operationId: emitirTokenDev
      summary: >-
        IdP de dev local exposto por HTTP (RAZ-228/RAZ-242/ADR-0052 item 1) — assina um JWT
        RS256 de verdade (`AssinadorJwtDevIdp`) para o formulário "Modo desenvolvimento" do
        SPA, substituindo a string opaca `dev.<cpf>.<ente>` que `AuthContext.entrar`
        fabricava antes (RAZ-120), sempre rejeitada por `VerificadorJwtGovBr` contra um
        backend real. `papel` é aceito só para o contrato ficar estável — NÃO vira claim do
        JWT nem decide nada aqui (RBAC é 100% via `siafic.iam.concessoes`, deny-by-default);
        o frontend (`sessaoClient.emitirTokenDev`) não o envia. Sem `credentials: 'include'`
        — stateless, não depende do cookie do BFF (ADR-0035). A rota só existe (404 senão,
        fail-closed por ausência de rota) quando o backend roda com
        `SIAFIC_DEV_IDP_ENABLED=true` + `IAM_ENABLED=true` + o par de chaves de dev completo
        — nunca em staging/produção. # java: sessao.SessaoDevIdpController.emitirToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessaoDevIdpRequest' }
      responses:
        '200':
          description: Token de dev emitido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoDevIdpResponse' }
        '400':
          description: >-
            cpf (não tem 11 dígitos) ou enteId (não é UUID) malformados — envelope MÍNIMO
            (`{erro}`), NÃO o `ErroContratoResponse` padrão: este endpoint responde direto
            no controller, sem passar pelo `ErroContratoExceptionHandler` central.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoDevIdpErro' }
        '404':
          description: >-
            Rota inexistente — backend rodando sem as flags/chaves de dev-IdP (fail-closed
            por ausência de bean/rota, nunca 403/500). Sem corpo JSON garantido (pode ser a
            página de erro default do Spring) — `sessaoClient.emitirTokenDev` trata por
            status, não por corpo (ver `DevIdpTokenError`/`endpoint_indisponivel`).
  /assinatura/oauth/callback:
    servers:
      - url: /
    get:
      operationId: callbackOAuthAssinatura
      summary: >-
        Callback aberto pelo navegador do gov.br após o login — nunca um cliente fetch, por
        isso sempre devolve 302 para a rota fixa do SPA (frontend-retorno-uri), nunca corpo
        JSON (ADR-0039 decisão 3). Sucesso: ?resultado=ok. Erro: ?resultado=erro&codigo=<taxonomia
        §6.1> (state_ausente, state_invalido, oauth_recusado, code_ausente, ente_divergente,
        oauth_provedor_indisponivel) — nenhum material sensível (token/CPF/hash) na query
        string (R4, ratificação RAZ-152). # java: assinatura.AssinaturaGovBrOAuthController.callback
      security:
        - assinaturaSessao: []
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
        - name: error_description
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Redirect para frontend-retorno-uri com ?resultado=ok|erro[&codigo=...].
          headers:
            Location: { schema: { type: string, format: uri } }
components:
  securitySchemes:
    govbrBearer:
      type: http
      scheme: bearer
      description: >
        java: consulta.SessaoAutenticadaHttpResolver — "Authorization: Bearer <asserção gov.br>",
        verificada a cada request via ServicoIdentidade.autenticar (stateless, sem cookie/sessão).
    assinaturaSessao:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: >
        java: assinatura.AssinaturaGovBrOAuthController / assinatura.AssinaturaEmpenhoController —
        HttpSession/cookie (RepositorioSessaoAssinaturaGovBr guarda state/PKCE/token na sessão),
        NÃO Authorization: Bearer. Única exceção documentada ao security scheme padrão deste
        contrato (§6.1) — ADR-0017, decisão 5 do ADR-0039.
    sessaoLogin:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: >
        java: sessao.SessaoLoginGovBrOAuthController / consulta.SessaoAutenticadaHttpResolver —
        cookie de sessão do BFF de LOGIN geral (ADR-0035), reverificado a cada request via
        ServicoIdentidade.autenticar (RepositorioAssercaoSessaoLoginGovBr guarda a asserção
        gov.br server-side). Mesmo nome de cookie (JSESSIONID) que assinaturaSessao — a
        HttpSession do container é uma só — mas escopo/propósito distintos: aquele guarda
        state/PKCE da assinatura eletrônica interativa (ADR-0017), este guarda a asserção
        da sessão de login geral, aceita como fallback aditivo ao Authorization: Bearer por
        qualquer consulta/endpoint autenticado (RAZ-128), não só o fluxo de assinatura.
  responses:
    ErroContrato:
      description: Envelope único de erro (RAZ-79 §6.1 / ADR-0030 §3). # java: consulta.ErroContratoExceptionHandler
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroContratoResponse' }
  schemas:
    Dinheiro:
      type: string
      description: >
        Decimal (escala 2) serializado como string pelo DinheiroJacksonModule real
        (ADR-0030 §2) — nunca number no cliente.
      example: '128450.00'
    ErroContratoResponse:
      type: object
      required: [codigo, mensagem, detalhes]
      properties:
        codigo: { type: string, example: nao_autenticado }
        mensagem: { type: string }
        detalhes: { type: object, additionalProperties: { type: string } }
    SessaoDevIdpRequest:
      type: object
      # java: sessao.SessaoDevIdpController.SessaoDevIdpRequest — RAZ-228/ADR-0052.
      # papel e' opcional aqui porque o frontend real (sessaoClient.emitirTokenDev) nao o
      # envia (o backend nunca le, so aceita pra estabilidade do contrato); required so em
      # cpf/enteId, que o controller de fato valida.
      required: [cpf, enteId]
      properties:
        cpf: { type: string, description: '11 dígitos, com ou sem pontuação.' }
        enteId: { type: string, format: uuid }
        papel:
          type: string
          nullable: true
          description: 'Só estabiliza o contrato do form de dev — não vira claim nem decide RBAC.'
    SessaoDevIdpResponse:
      type: object
      # java: sessao.SessaoDevIdpController.SessaoDevIdpResponse
      required: [bearerToken]
      properties:
        bearerToken: { type: string, description: 'JWT RS256 assinado pela chave de dev.' }
    SessaoDevIdpErro:
      type: object
      # java: Map.of("erro", ...) direto no controller — bespoke, não é ErroContratoResponse.
      required: [erro]
      properties:
        erro: { type: string, enum: [cpf_invalido, ente_id_invalido] }
    SessaoAtualResponse:
      type: object
      # java: sessao.SessaoAtualController.SessaoAtualResponse — RAZ-203.
      required: [cpfMascarado, enteId, orgao, mfaConcluido]
      properties:
        cpfMascarado:
          type: string
          example: '***.456.***-**'
          description: 'CPF já mascarado no boundary (R4) — nunca em claro (Sessao.titular().mascarado()).'
        enteId: { type: string, format: uuid }
        orgao:
          type: string
          nullable: true
          description: 'Ausente quando a asserção gov.br não carrega órgão.'
        mfaConcluido: { type: boolean }
    EmpenhoRequest:
      type: object
      required: [dotacaoId, tipo, credorId, unidadeGestoraId, valor, dataFato, exercicio, classificacaoOrcamentaria, fonteRecurso, historico]
      properties:
        dotacaoId: { type: string, format: uuid }
        tipo: { type: string, enum: [ordinario, estimativo, global] }
        credorId: { type: string, format: uuid }
        unidadeGestoraId: { type: string, format: uuid }
        contratoId: { type: string, format: uuid, nullable: true }
        valor: { $ref: '#/components/schemas/Dinheiro' }
        dataFato: { type: string, format: date }
        exercicio: { type: integer }
        classificacaoOrcamentaria: { type: string }
        fonteRecurso: { type: string }
        historico: { type: string }
    EmpenhoResponse:
      type: object
      required: [id, numeroSequencial, exercicio, tipo, dotacaoId, credorId, unidadeGestoraId, valor, dataFato, classificacaoOrcamentaria, fonteRecurso, historico, fatoContabilId]
      properties:
        id: { type: string, format: uuid }
        numeroSequencial: { type: integer, format: int64 }
        exercicio: { type: integer }
        tipo: { type: string, enum: [ordinario, estimativo, global] }
        dotacaoId: { type: string, format: uuid }
        credorId: { type: string, format: uuid }
        unidadeGestoraId: { type: string, format: uuid }
        contratoId: { type: string, format: uuid, nullable: true }
        valor: { $ref: '#/components/schemas/Dinheiro' }
        dataFato: { type: string, format: date }
        classificacaoOrcamentaria: { type: string }
        fonteRecurso: { type: string }
        historico: { type: string }
        fatoContabilId: { type: string, format: uuid }
    EmpenhoPorIdResponse:
      type: object
      # java: consulta.ExecucaoConsultaController.EmpenhoPorIdResponse — RAZ-156/ADR-0039 decisão 1.
      required: [id, numeroSequencial, exercicio, tipo, credorId, valor, dataFato, historico, status, documento]
      properties:
        id: { type: string, format: uuid }
        numeroSequencial: { type: integer, format: int64 }
        exercicio: { type: integer }
        tipo: { type: string, enum: [ordinario, estimativo, global] }
        credorId: { type: string, format: uuid }
        valor: { $ref: '#/components/schemas/Dinheiro' }
        dataFato: { type: string, format: date }
        historico: { type: string }
        status: { type: string, enum: [registrado, pendente_assinatura, assinado, assinatura_rejeitada] }
        documento: { $ref: '#/components/schemas/DocumentoEmpenhoResponse' }
    DocumentoEmpenhoResponse:
      type: object
      required: [pendenteUri, assinado]
      properties:
        pendenteUri:
          type: string
          nullable: true
          description: >-
            Indicador OPACO de presença do documento pendente — NUNCA a s3://
            crua do object store (ADR-0009 §RAZ-45). Presente só quando status é
            pendente_assinatura/assinatura_rejeitada; o binário sai por
            GET .../empenhos/{id}/documento (RAZ-157), nunca por este campo.
        assinado:
          allOf:
            - $ref: '#/components/schemas/DocumentoAssinadoResponse'
          nullable: true
          description: Preenchido só quando status = assinado.
    DocumentoAssinadoResponse:
      type: object
      required: [hashSha256, idTransacao, nivel, signatario, assinadoEm]
      properties:
        hashSha256: { type: string }
        idTransacao: { type: string, format: uuid }
        nivel: { type: string, enum: [AVANCADA_GOVBR, QUALIFICADA_ICP_BRASIL] }
        signatario:
          type: string
          description: 'CPF do signatário, mascarado no boundary (R4, ADR-0039) — nunca em claro.'
        assinadoEm: { type: string, format: date-time }
    EmpenhoRegistradoResponse:
      type: object
      # java: consulta.ExecucaoConsultaController.EmpenhoRegistradoResponse — RAZ-121.
      required: [id, numeroSequencial, exercicio, tipo, credorId, valor, dataFato, historico, status]
      properties:
        id: { type: string, format: uuid }
        numeroSequencial: { type: integer, format: int64 }
        exercicio: { type: integer }
        tipo: { type: string, enum: [ordinario, estimativo, global] }
        credorId: { type: string, format: uuid }
        valor: { $ref: '#/components/schemas/Dinheiro' }
        dataFato: { type: string, format: date }
        historico: { type: string }
        status: { type: string, enum: [registrado, pendente_assinatura, assinado, assinatura_rejeitada] }
    EmpenhosRegistradosResponse:
      type: object
      # java: consulta.ExecucaoConsultaController.EmpenhosRegistradosResponse
      required: [itens, proximoCursor]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/EmpenhoRegistradoResponse' }
        proximoCursor: { type: string, nullable: true }
    DotacaoResponse:
      type: object
      # java: consulta.ExecucaoConsultaController.DotacaoResponse — RAZ-148/ADR-0038.
      required:
        [id, exercicio, classificacaoOrcamentaria, fonteRecurso, unidadeGestoraId, valorAutorizado, valorComprometido, saldoDisponivel]
      properties:
        id: { type: string, format: uuid }
        exercicio: { type: integer }
        classificacaoOrcamentaria: { type: string }
        fonteRecurso: { type: string }
        unidadeGestoraId: { type: string, format: uuid }
        valorAutorizado: { $ref: '#/components/schemas/Dinheiro' }
        valorComprometido: { $ref: '#/components/schemas/Dinheiro' }
        saldoDisponivel:
          allOf: [{ $ref: '#/components/schemas/Dinheiro' }]
          description: 'valorAutorizado - valorComprometido. Sem campo "bloqueado" — reserva/pré-empenho ainda não existe no domínio.'
    DotacoesResponse:
      type: object
      # java: consulta.ExecucaoConsultaController.DotacoesResponse
      required: [itens, proximoCursor]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/DotacaoResponse' }
        proximoCursor: { type: string, nullable: true }
    LiquidacaoRequest:
      type: object
      required: [empenhoId, dataCompetencia, valor, documentosSuporte, historico]
      properties:
        empenhoId: { type: string, format: uuid }
        dataCompetencia: { type: string, format: date }
        valor: { $ref: '#/components/schemas/Dinheiro' }
        documentosSuporte:
          type: array
          items: { $ref: '#/components/schemas/DocumentoSuporte' }
        historico: { type: string }
    DocumentoSuporte:
      type: object
      required: [tipo, numero, dataEmissao]
      properties:
        tipo: { type: string }
        numero: { type: string }
        dataEmissao: { type: string, format: date }
        referenciaExterna: { type: string, nullable: true }
    LiquidacaoResponse:
      type: object
      required: [id, empenhoId, dataCompetencia, valor, documentosSuporte, historico, fatoContabilId, status]
      properties:
        id: { type: string, format: uuid }
        empenhoId: { type: string, format: uuid }
        dataCompetencia: { type: string, format: date }
        valor: { $ref: '#/components/schemas/Dinheiro' }
        documentosSuporte:
          type: array
          items: { $ref: '#/components/schemas/DocumentoSuporte' }
        historico: { type: string }
        fatoContabilId: { type: string, format: uuid }
        status: { type: string, enum: [pendente, aprovada, devolvida] }
    AprovacaoRequest:
      # java: escrita.LiquidacaoController.AprovacaoRequest — decisao vira
      # DecisaoAprovacao.valueOf(decisao.toUpperCase()) (execucao-domain).
      type: object
      required: [decisao]
      properties:
        decisao: { type: string, enum: [aprovar, devolver] }
        motivo: { type: string, nullable: true }
    PagamentoRequest:
      type: object
      required: [liquidacaoId, dataCompetencia, valor, natureza, historico]
      properties:
        liquidacaoId: { type: string, format: uuid }
        dataCompetencia: { type: string, format: date }
        valor: { $ref: '#/components/schemas/Dinheiro' }
        natureza: { type: string }
        beneficiario: { $ref: '#/components/schemas/Beneficiario', nullable: true }
        ordemBancaria: { type: string, nullable: true }
        historico: { type: string }
    Beneficiario:
      type: object
      required: [nome, cpfCnpj]
      properties:
        nome: { type: string }
        cpfCnpj: { type: string, description: 'Mascarado na resposta — nunca em claro (RAZ-79 §6.1).' }
    PagamentoResponse:
      type: object
      required: [id, liquidacaoId, dataCompetencia, valor, natureza, historico, fatoContabilId]
      properties:
        id: { type: string, format: uuid }
        liquidacaoId: { type: string, format: uuid }
        dataCompetencia: { type: string, format: date }
        valor: { $ref: '#/components/schemas/Dinheiro' }
        natureza: { type: string }
        beneficiario: { $ref: '#/components/schemas/Beneficiario', nullable: true }
        ordemBancaria: { type: string, nullable: true }
        historico: { type: string }
        fatoContabilId: { type: string, format: uuid }
    ExecucaoOrcamentariaResponse:
      type: object
      required: [exercicio, mes, totalEmpenhado, totalLiquidado, totalPago, saldoALiquidar, saldoAPagar]
      properties:
        exercicio: { type: integer }
        mes: { type: integer }
        totalEmpenhado: { $ref: '#/components/schemas/Dinheiro' }
        totalLiquidado: { $ref: '#/components/schemas/Dinheiro' }
        totalPago: { $ref: '#/components/schemas/Dinheiro' }
        saldoALiquidar: { $ref: '#/components/schemas/Dinheiro' }
        saldoAPagar: { $ref: '#/components/schemas/Dinheiro' }
    AssinaturaEmpenhoResponse:
      type: object
      # java: assinatura.AssinaturaEmpenhoResponse — não expõe URI interna do object
      # store; o PDF assinado sai pelo endpoint HTTP de documento.
      required: [empenhoId, status, documentoAssinado, hashSha256, idTransacao]
      properties:
        empenhoId: { type: string, format: uuid }
        status: { type: string, description: 'Status do empenho após assinatura (ex.: ASSINADO).' }
        documentoAssinado: { type: boolean }
        hashSha256: { type: string }
        idTransacao: { type: string, format: uuid }
    SaldoContaResponse:
      type: object
      # java: consulta.SaldoContaResponse
      required: [contaId, saldo]
      properties:
        contaId: { type: string, format: uuid }
        saldo: { $ref: '#/components/schemas/Dinheiro' }
    LinhaBalancete:
      type: object
      # java: consulta.BalanceteResponse.Linha
      required:
        [contaId, codigo, descricao, naturezaSaldo, saldoAnterior, movimentoDebito, movimentoCredito, saldoAtual]
      properties:
        contaId: { type: string, format: uuid }
        codigo: { type: string }
        descricao: { type: string }
        naturezaSaldo:
          type: string
          description: 'D/C — natureza natural da conta PCASP (ADR-0030 §5), não o sinal do saldo.'
        saldoAnterior: { $ref: '#/components/schemas/Dinheiro' }
        movimentoDebito: { $ref: '#/components/schemas/Dinheiro' }
        movimentoCredito: { $ref: '#/components/schemas/Dinheiro' }
        saldoAtual: { $ref: '#/components/schemas/Dinheiro' }
    BalanceteResponse:
      type: object
      # java: consulta.BalanceteResponse
      required: [exercicio, mes, linhas, totalMovimentoDebito, totalMovimentoCredito, confere]
      properties:
        exercicio: { type: integer }
        mes: { type: integer }
        linhas:
          type: array
          items: { $ref: '#/components/schemas/LinhaBalancete' }
        totalMovimentoDebito: { $ref: '#/components/schemas/Dinheiro' }
        totalMovimentoCredito: { $ref: '#/components/schemas/Dinheiro' }
        confere:
          type: boolean
          description: 'Σdébitos = Σcréditos do período (razão append-only).'
    LinhaDemonstracaoDcasp:
      type: object
      # java: consulta.DemonstracoesDcaspResponse.Linha
      required: [codigo, descricao, valores]
      properties:
        codigo: { type: string }
        descricao: { type: string }
        valores:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Dinheiro' }
          description: 'Colunas nomeadas por demonstração; dinheiro sempre como string decimal.'
    DemonstracaoDcasp:
      type: object
      # java: consulta.DemonstracoesDcaspResponse.Demonstracao
      required: [linhas]
      properties:
        linhas:
          type: array
          items: { $ref: '#/components/schemas/LinhaDemonstracaoDcasp' }
    DemonstracoesDcaspResponse:
      type: object
      # java: consulta.DemonstracoesDcaspResponse
      required: [exercicio, balancoOrcamentario, balancoFinanceiro, balancoPatrimonial, dvp]
      properties:
        exercicio: { type: integer }
        balancoOrcamentario: { $ref: '#/components/schemas/DemonstracaoDcasp' }
        balancoFinanceiro: { $ref: '#/components/schemas/DemonstracaoDcasp' }
        balancoPatrimonial: { $ref: '#/components/schemas/DemonstracaoDcasp' }
        dvp: { $ref: '#/components/schemas/DemonstracaoDcasp' }
    ContaResumo:
      type: object
      # java: consulta.CatalogoContasController.ContaResumoResponse
      required: [id, codigo, descricao, naturezaSaldo, naturezaInformacao, escrituravel]
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        descricao: { type: string }
        naturezaSaldo: { type: string }
        naturezaInformacao: { type: string }
        escrituravel: { type: boolean }
        contaPaiId: { type: string, format: uuid, nullable: true }
    ContasResponse:
      type: object
      # java: consulta.CatalogoContasController.ContasResponse
      required: [itens, proximoCursor]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/ContaResumo' }
        proximoCursor: { type: string, nullable: true }
    ItemFilaAprovacao:
      type: object
      # java: consulta.ExecucaoConsultaController.ItemFilaResponse
      required:
        [id, empenhoId, numeroEmpenho, exercicioEmpenho, credorId, valor, dataCompetencia, statusAprovacao]
      properties:
        id: { type: string, format: uuid }
        empenhoId: { type: string, format: uuid }
        numeroEmpenho: { type: integer, format: int64 }
        exercicioEmpenho: { type: integer }
        credorId: { type: string, format: uuid }
        valor: { $ref: '#/components/schemas/Dinheiro' }
        dataCompetencia: { type: string, format: date }
        statusAprovacao: { type: string, enum: [pendente, aprovada, devolvida] }
    FilaAprovacaoResponse:
      type: object
      # java: consulta.ExecucaoConsultaController.FilaAprovacaoResponse
      required: [itens, proximoCursor]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/ItemFilaAprovacao' }
        proximoCursor: { type: string, nullable: true }
    EventoTrilha:
      type: object
      # java: consulta.ExecucaoConsultaController.EventoTrilhaResponse
      required: [tipo, ator, quando, detalhes]
      properties:
        tipo: { type: string }
        ator:
          type: string
          description: 'Ator mascarado no boundary — nunca CPF em claro (R4, ADR-0029 §3).'
        quando: { type: string, format: date-time }
        detalhes: { type: object, additionalProperties: { type: string } }
    TrilhaResponse:
      type: object
      # java: consulta.ExecucaoConsultaController.TrilhaResponse
      required: [liquidacaoId, eventos]
      properties:
        liquidacaoId: { type: string, format: uuid }
        eventos:
          type: array
          items: { $ref: '#/components/schemas/EventoTrilha' }
