# Configuração base do sistema contábil (Razão / SIAFIC).
# Valores sensíveis vêm de variáveis de ambiente; defaults servem só para dev local.
spring:
  application:
    name: razao
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/razao}
    username: ${DB_USER:razao}
    password: ${DB_PASSWORD:razao}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: razao-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    open-in-view: false
    # Flyway é o DONO do schema. JPA jamais altera DDL — apenas valida o mapeamento.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: contabil
    schemas: contabil
    create-schemas: true
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    br.contabil: INFO
    org.flywaydb: INFO
