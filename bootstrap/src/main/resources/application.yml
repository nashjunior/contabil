# Configuração base do sistema contábil (Razão / SIAFIC).
# Segredos vêm do port de cofre e, no F0, são injetados via ambiente/secret file no runtime.
spring:
  application:
    name: razao
  datasource:
    url: ${DB_RUNTIME_URL}
    username: ${DB_RUNTIME_USER}
    password-ref: ${DB_RUNTIME_PASSWORD_REF:cofre://siafic/f0/db/runtime/password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: razao-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-init-sql: "${DB_CONNECTION_INIT_SQL:SET statement_timeout = '30s'; SET lock_timeout = '5s'}"
  jdbc:
    template:
      query-timeout: ${DB_QUERY_TIMEOUT_SECONDS:30}
  jpa:
    open-in-view: false
    # Flyway é o DONO do schema. JPA jamais altera DDL — apenas valida o mapeamento.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    url: ${DB_MIGRATION_URL}
    user: ${DB_MIGRATION_USER}
    password-ref: ${DB_MIGRATION_PASSWORD_REF:cofre://siafic/f0/db/migration/password}
    locations: classpath:db/migration
    create-schemas: true
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    br.contabil: INFO
    org.flywaydb: INFO

siafic:
  entrega:
    outbox:
      enabled: ${OUTBOX_WORKER_ENABLED:false}
      intervalo-ms: ${OUTBOX_WORKER_INTERVALO_MS:10000}
      batch-size: ${OUTBOX_WORKER_BATCH_SIZE:50}
      max-tentativas: ${OUTBOX_WORKER_MAX_TENTATIVAS:5}
      lock-duration: ${OUTBOX_WORKER_LOCK_DURATION:PT2M}
      backoff-base: ${OUTBOX_WORKER_BACKOFF_BASE:PT5S}
      backoff-max: ${OUTBOX_WORKER_BACKOFF_MAX:PT15M}
  iam:
    enabled: ${IAM_ENABLED:false}
    session-ttl: ${IAM_SESSION_TTL:PT8H}
    govbr:
      issuer: ${GOVBR_IAM_ISSUER:https://sso.staging.acesso.gov.br}
      audience: ${GOVBR_IAM_AUDIENCE:}
      public-key-pem: ${GOVBR_IAM_PUBLIC_KEY_PEM:}
      cpf-claim: ${GOVBR_IAM_CPF_CLAIM:cpf}
      ente-claim: ${GOVBR_IAM_ENTE_CLAIM:ente_id}
      orgao-claim: ${GOVBR_IAM_ORGAO_CLAIM:orgao}
      nivel-claim: ${GOVBR_IAM_NIVEL_CLAIM:nivel_conta}
    icp:
      certificados-confiaveis-sha256: []
    concessoes: []
  security:
    database:
      require-ssl: ${DB_REQUIRE_SSL:true}
  assinatura:
    govbr:
      resilience:
        connect-timeout: ${GOVBR_ASSINATURA_CONNECT_TIMEOUT:PT3S}
        request-timeout: ${GOVBR_ASSINATURA_REQUEST_TIMEOUT:PT10S}
        retry-max-attempts: ${GOVBR_ASSINATURA_RETRY_MAX_ATTEMPTS:2}
        retry-wait-duration: ${GOVBR_ASSINATURA_RETRY_WAIT_DURATION:PT0.2S}
        circuit-sliding-window-size: ${GOVBR_ASSINATURA_CIRCUIT_WINDOW_SIZE:10}
        circuit-minimum-number-of-calls: ${GOVBR_ASSINATURA_CIRCUIT_MIN_CALLS:5}
        circuit-failure-rate-threshold: ${GOVBR_ASSINATURA_CIRCUIT_FAILURE_RATE:50}
        circuit-wait-duration-in-open-state: ${GOVBR_ASSINATURA_CIRCUIT_OPEN_WAIT:PT30S}
        circuit-permitted-calls-in-half-open-state: ${GOVBR_ASSINATURA_CIRCUIT_HALF_OPEN_CALLS:2}
      oauth:
        authorization-uri: ${GOVBR_ASSINATURA_OAUTH_AUTHORIZATION_URI:https://cas.staging.iti.br/oauth2.0/authorize}
        token-uri: ${GOVBR_ASSINATURA_OAUTH_TOKEN_URI:https://cas.staging.iti.br/oauth2.0/accessToken}
        client-id: ${GOVBR_ASSINATURA_OAUTH_CLIENT_ID:}
        client-secret-ref: ${GOVBR_ASSINATURA_OAUTH_CLIENT_SECRET_REF:cofre://siafic/f0/assinatura/govbr/oauth/client-secret}
        redirect-uri: ${GOVBR_ASSINATURA_OAUTH_REDIRECT_URI:http://localhost:8080/assinatura/oauth/callback}
        scopes:
          - sign
          - signature_session
        state-ttl: ${GOVBR_ASSINATURA_OAUTH_STATE_TTL:PT10M}
