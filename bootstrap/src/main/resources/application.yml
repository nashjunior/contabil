# Configuração base do sistema contábil (Razão / SIAFIC).
# Segredos vêm do cofre/KMS/HSM e são injetados via ambiente no runtime.
spring:
  application:
    name: razao
  datasource:
    url: ${DB_RUNTIME_URL}
    username: ${DB_RUNTIME_USER}
    password-ref: ${DB_RUNTIME_PASSWORD_REF:cofre://siafic/f0/db/runtime/password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: razao-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    open-in-view: false
    # Flyway é o DONO do schema. JPA jamais altera DDL — apenas valida o mapeamento.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    url: ${DB_MIGRATION_URL}
    user: ${DB_MIGRATION_USER}
    password-ref: ${DB_MIGRATION_PASSWORD_REF:cofre://siafic/f0/db/migration/password}
    locations: classpath:db/migration
    create-schemas: true
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    br.contabil: INFO
    org.flywaydb: INFO

siafic:
  assinatura:
    govbr:
      oauth:
        authorization-uri: ${GOVBR_ASSINATURA_OAUTH_AUTHORIZATION_URI:https://cas.staging.iti.br/oauth2.0/authorize}
        token-uri: ${GOVBR_ASSINATURA_OAUTH_TOKEN_URI:https://cas.staging.iti.br/oauth2.0/accessToken}
        client-id: ${GOVBR_ASSINATURA_OAUTH_CLIENT_ID:}
        client-secret-ref: ${GOVBR_ASSINATURA_OAUTH_CLIENT_SECRET_REF:cofre://siafic/f0/assinatura/govbr/oauth/client-secret}
        redirect-uri: ${GOVBR_ASSINATURA_OAUTH_REDIRECT_URI:http://localhost:8080/assinatura/oauth/callback}
        scopes:
          - sign
          - signature_session
        state-ttl: ${GOVBR_ASSINATURA_OAUTH_STATE_TTL:PT10M}
