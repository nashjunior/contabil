# Fase de scaffold: regras cuja cláusula `that()` ainda não casa nenhuma classe
# (ex.: repositórios do razão, campos @Monetario) NÃO falham por vacuidade — elas
# passam a valer automaticamente assim que as classes correspondentes existirem.
# É o comportamento correto para um monólito em construção; não afrouxa nenhuma
# regra sobre código que EXISTE.
archRule.failOnEmptyShould=false
